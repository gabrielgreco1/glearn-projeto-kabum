# Para onde vão os alertas que o Prometheus dispara, agrupados e sem repetição.
route:
  receiver: avisos
  group_by: [servico]     # alertas do mesmo serviço viram uma notificação só
  group_wait: 30s         # espera 30 s pelo resto do grupo antes da primeira notificação
  group_interval: 5m      # alerta novo no grupo: no máximo uma notificação a cada 5 minutos
  repeat_interval: 4h     # o mesmo alerta, ainda disparando: lembra de 4 em 4 horas

receivers:
  - name: avisos
    webhook_configs:
      # O receptor da sua máquina (alertas/receptor.py), visto de dentro do Docker.
      - url: http://host.docker.internal:5001/
        send_resolved: true

# Quando a execução falhou, o dado velho é consequência: o alerta da causa cala o do sintoma.
inhibit_rules:
  - source_matchers: [alertname = KabumExecucaoFalhou]
    target_matchers: [alertname = KabumDadoVelho]
    equal: [servico]
