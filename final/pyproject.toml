[project]
name = "projeto-kabum"
version = "0.1.0"
description = "Histórico de preços das placas de vídeo da Kabum, pela API de catálogo que a própria loja usa."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]
